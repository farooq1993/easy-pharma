name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compress project files
        run: |
          tar -czf project.tar.gz --exclude=db.sqlite3 --exclude=venv --exclude=env --exclude=.git --exclude=.github --exclude=.vscode --exclude=staticfiles .

      - name: Copy archive to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "project.tar.gz"
          target: "/tmp/"

      - name: Run deploy commands on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # Extract files
            mkdir -p /var/www/easypharma
            tar -xzf /tmp/project.tar.gz -C /var/www/easypharma
            
            # Install/update python requirements
            /var/www/easypharma/venv/bin/pip install -r /var/www/easypharma/requirements.txt
            
            # Run collectstatic
            /var/www/easypharma/venv/bin/python /var/www/easypharma/manage.py collectstatic --noinput
            
            # Restart Gunicorn to apply changes
            systemctl restart gunicorn
            
            # Clean up
            rm -f /tmp/project.tar.gz
